<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>按國家展示畫作 — Hetalia</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --line: #dfe7f1;
    --text: #1f2937;
    --muted: #6b7280;
    --link: #0645ad;
    --link-hover: #0a3d91;
    --map-fill: #dcdcdc;
    --map-hover: #b3d4ff;
    --map-selected: #4a90e2;
    --zoom-btn-bg: rgba(255,255,255,0.9);
    --zoom-btn-shadow: 0 6px 18px rgba(12,18,31,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #container { display:flex; height:100vh; width:100%; }
  #map { flex: 1; min-width: 0; position: relative; background: linear-gradient(180deg, #f7fbff 0%, #edf5ff 100%); }
  svg { width:100%; height:100%; display:block; touch-action: none; }

  .country {
    fill: var(--map-fill);
    stroke: #fff;
    stroke-width: 0.5;
    cursor: pointer;
    transition: fill 0.15s ease;
  }
  .country:hover { fill: var(--map-hover); }
  .country.selected { fill: var(--map-selected); }

  #sidebar {
    display: none;
    width: 380px;
    max-width: 42vw;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -4px 0 12px rgba(0,0,0,0.04);
    padding: 16px;
    overflow: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateX(10px) scale(0.98);
    transition: opacity 220ms ease, transform 220ms ease, visibility 220ms;
    pointer-events: none;
  }
  #sidebar.visible {
    display: block;
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  @keyframes sidebarBounce {
    0% {
      opacity: 0;
      transform: translateX(14px) scale(0.96);
    }
    50% {
      opacity: 1;
      transform: translateX(-4px) scale(1.02);
    }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  #sidebar.panel-bounce {
    animation: sidebarBounce 260ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }

  .sidebar-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom: 12px;
  }
  #sidebar h2 { margin:0; font-size: 1.05rem; }

  .btn-close, .mini-link {
    background: #eef2f7;
    border: 1px solid #dbe3ec;
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    cursor: pointer;
    font: inherit;
  }
  .btn-close:hover, .mini-link:hover { background: #e4ebf5; }

  .no-art {
    color: var(--muted);
    padding: 10px 0;
    margin: 0;
  }

  .country-title { font-size: 1.1rem; margin: 0 0 8px; }
  .art-list { display:flex; flex-direction:column; gap:12px; }
  .art-item {
    display:flex;
    gap:12px;
    padding: 8px 0;
    border-bottom: 1px solid #eef2f7;
  }
  .thumb {
    width: 96px;
    height: 72px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid #e5e7eb;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .art-meta { flex: 1; min-width: 0; }
  .wiki-link {
    color: var(--link);
    text-decoration: underline;
    cursor: pointer;
    font-weight: 600;
  }
  .wiki-link:hover { color: var(--link-hover); }
  .art-year {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 4px;
  }
  .art-desc {
    color: var(--text);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-top: 6px;
  }
  .detail-container { display:flex; flex-direction:column; gap:10px; }
  .detail-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom: 8px;
  }
  .detail-image {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 8px;
    background: #f8f9fb;
    border: 1px solid #edf1f5;
  }
  .detail-text {
    line-height: 1.7;
    color: var(--text);
    margin: 0;
  }

  .hover-preview {
    position: absolute;
    pointer-events: none;
    background: linear-gradient(180deg, #ffffff, #f8fbff);
    border: 1px solid rgba(14, 41, 77, 0.08);
    box-shadow: 0 8px 24px rgba(12,18,31,0.12);
    border-radius: 8px;
    overflow: hidden;
    width: 260px;
    max-width: 38vw;
    display: flex;
    gap: 10px;
    padding: 10px;
    align-items: center;
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 60;
  }
  .hover-preview.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .hover-preview img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #eef2f7; }
  .hover-preview .hp-meta { display:flex; flex-direction:column; gap:6px; }
  .hover-preview .hp-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
  .hover-preview .hp-year { color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 800px), (hover: none) {
    .hover-preview { display: none !important; }
  }

  .zoom-controls {
    position: absolute;
    right: 12px;
    top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 50;
  }
  .zoom-btn {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--zoom-btn-bg);
    box-shadow: var(--zoom-btn-shadow);
    border: 1px solid #e6eef8;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    font-weight: 600;
    user-select: none;
  }
  .zoom-btn:active { transform: scale(0.98); }

  #tooltip {
    position:absolute;
    pointer-events:none;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
    display:none;
    z-index: 10;
  }

  #modal {
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(0,0,0,0.6);
    z-index:30;
    padding: 24px;
  }
  #modal .modal-inner {
    background:#fff;
    padding: 18px;
    border-radius: 12px;
    max-width: 90vw;
    max-height: 90vh;
    overflow:auto;
    box-shadow: 0 18px 42px rgba(0,0,0,0.2);
  }
  #modal img {
    max-width:100%;
    height:auto;
    display:block;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }

  @media (max-width: 800px) {
    #container { flex-direction:column; }
    #sidebar {
      display: none;
      width: 100%;
      max-width: 100%;
      border-left:none;
      border-top:none;
    }
    #sidebar.visible {
      display: block;
      width: 100%;
      max-width: 100%;
      max-height: 45vh;
      border-left:none;
      border-top:1px solid var(--line);
      padding: 16px;
    }
    .thumb { width: 120px; height: 90px; }
    .wiki-link { font-size: 1rem; }
    .zoom-btn { width: 52px; height: 52px; border-radius: 12px; }
    #modal .modal-inner {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
      padding: 12px 12px 24px 12px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:stretch;
    }
    #modal img { max-height: calc(100vh - 200px); object-fit: contain; }
  }
</style>
</head>
<body>
<div id="container">
  <div id="map"><div id="tooltip"></div><div id="hoverPreview" class="hover-preview" aria-hidden="true"></div></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>請選擇一個國家</h2>
      <button id="clearBtn" class="btn-close">清除</button>
    </div>
    <div id="countryInfo">
      <p class="no-art">點選地圖上的國家以查看對應畫作。</p>
    </div>
  </aside>
</div>

<div class="zoom-controls" aria-hidden="false">
  <button id="zoomIn" class="zoom-btn" aria-label="放大">+</button>
  <button id="zoomOut" class="zoom-btn" aria-label="縮小">−</button>
  <button id="zoomReset" class="zoom-btn" aria-label="重置">◯</button>
</div>

<div id="modal" aria-hidden="true">
  <div class="modal-inner">
    <button id="closeModal" class="btn-close" style="float:right">關閉</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const geojsonUrl = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';

const numericCountryToIso2 = {
  '156': 'CN',
  '392': 'JP',
  '250': 'FR',
  '840': 'US',
  '124': 'CA',
  '276': 'DE',
  '826': 'GB',
  '380': 'IT',
  '643': 'RU',
  '356': 'IN',
  '710': 'ZA',
  '76': 'BR',
  '484': 'MX',
  '032': 'AR',
  '036': 'AU',
  '554': 'NZ',
  '704': 'VN',
  '764': 'TH',
  '702': 'SG',
  '360': 'ID',
  '458': 'MY',
  '608': 'PH',
  '410': 'KR',
  '804': 'UA',
  '398': 'KZ',
  '050': 'BD',
  '344': 'HK',
  '528': 'NL',
  '724': 'ES',
  '752': 'SE',
  '203': 'CZ',
  '756': 'CH'
};

const englishToChinese = {
  'China': '中國',
  'Japan': '日本',
  'United States': '美國',
  'France': '法國',
  'Germany': '德國',
  'United Kingdom': '英國',
  'South Korea': '韓國',
  'Italy': '義大利',
  'Spain': '西班牙',
  'Russia': '俄羅斯',
  'Canada': '加拿大',
  'Australia': '澳大利亞'
};

const artworkData = {
  "CN": [
    { title: "中國的記憶", url: "China.png", year: 2026, desc: "0000" }
  ],
  "DE": [
    { title: "德國的記憶", url: "Germany.png", year: 2026, desc: "0000" }
  ],
  "FR": [
    { title: "法國的記憶", url: "france.png", year: 2026, desc: "0000" }
  ],
  "JP": [
    { title: "日本的記憶", url: "Japan.png", year: 2024, desc: "0000" }
  ],
  "CA": [
    { title: "加拿大的記憶", url: "canda1.png", year: 2026, desc: "0000" }
  ],
  "US": [
    { title: "美國的記憶", url: "american.png", year: 2021, desc: "0000" }
  ]
};

const width = Math.max(700, window.innerWidth * 0.6);
const height = Math.max(400, window.innerHeight);
const svg = d3.select("#map").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("preserveAspectRatio", "xMidYMid meet");
const g = svg.append('g').attr('id', 'countries');
const tooltip = d3.select("#tooltip");
const hoverPreviewEl = document.getElementById('hoverPreview');
const projection = d3.geoMercator()
  .scale((width / 2 / Math.PI) * 1.1)
  .translate([width / 2, height / 1.8]);
const path = d3.geoPath().projection(projection);

let zoomBehavior;
const sidebarEl = document.getElementById('sidebar');

function triggerSidebarBounce() {
  sidebarEl.classList.remove('panel-bounce');
  void sidebarEl.offsetWidth;
  sidebarEl.classList.add('panel-bounce');
}

function showSidebar() {
  sidebarEl.style.display = 'block';
  sidebarEl.classList.add('visible');
  triggerSidebarBounce();
}

function hideSidebar() {
  sidebarEl.classList.remove('visible', 'panel-bounce');
  sidebarEl.style.display = 'none';
}

function getNumericIso2(d) {
  const id = String(d && d.id || '');
  return numericCountryToIso2[id] || null;
}

function getCountryKey(d) {
  const iso2 = getNumericIso2(d);
  if (iso2) return iso2;

  const props = d && d.properties ? d.properties : {};
  const name = props.name || props.NAME || props.ADMIN || '';
  const normalized = name.trim();
  if (normalized) return normalized;
  return null;
}

function getCountryDisplayName(d) {
  const props = d && d.properties ? d.properties : {};
  return props.name || props.NAME || props.ADMIN || getCountryKey(d) || '';
}

function getLocalizedDisplay(d) {
  const en = getCountryDisplayName(d);
  const zh = englishToChinese[en] || englishToChinese[getCountryKey(d)] || null;
  return zh ? `${zh} (${en})` : en;
}

function propNameToEnglish(name) {
  const map = { '中國': 'China', '日本': 'Japan', '美國': 'United States' };
  return map[name] || name;
}

function renderMap() {
  d3.json(geojsonUrl).then(world => {
    const countries = topojson.feature(world, world.objects.countries);

    g.selectAll("path")
      .data(countries.features)
      .join("path")
        .attr("class", "country")
        .attr("d", path)
        .on("mouseover", (event, d) => {
          d3.select(event.currentTarget).raise();
          tooltip.style("display", "block").text(getLocalizedDisplay(d));
          showHoverPreview(d, event);
        })
        .on("mousemove", (event, d) => {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY + 12) + "px");
          updateHoverPreviewPosition(event);
        })
        .on("mouseout", () => {
          tooltip.style("display", "none");
          hideHoverPreview();
        })
        .on("click", (event, d) => {
          g.selectAll(".country").classed("selected", false);
          d3.select(event.currentTarget).classed("selected", true);
          showArtworksForCountry(d);
        });

    zoomBehavior = d3.zoom()
      .scaleExtent([1, 8])
      .on('zoom', (event) => {
        g.attr('transform', event.transform);
        g.selectAll('.country').style('stroke-width', (0.5 / event.transform.k));
      });

    svg.call(zoomBehavior);
    attachZoomControls();

  }).catch(err => {
    document.getElementById('countryInfo').innerHTML = '<p class="no-art">地圖載入失敗，請檢查網路或 TopoJSON 連線。</p>';
    console.error(err);
  });
}

function attachZoomControls() {
  const zoomIn = document.getElementById('zoomIn');
  const zoomOut = document.getElementById('zoomOut');
  const zoomReset = document.getElementById('zoomReset');

  zoomIn.addEventListener('click', () => {
    svg.transition().duration(250).call(zoomBehavior.scaleBy, 1.4);
  });
  zoomOut.addEventListener('click', () => {
    svg.transition().duration(250).call(zoomBehavior.scaleBy, 1 / 1.4);
  });
  zoomReset.addEventListener('click', () => {
    svg.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity);
  });
}

function findArtForFeature(d) {
  const englishName = getCountryDisplayName(d);
  const key = getCountryKey(d);
  const possibleKeys = [key, (key || '').toUpperCase(), (key || '').toLowerCase(), englishName, propNameToEnglish(englishName)];
  for (const k of possibleKeys) {
    if (!k) continue;
    if (artworkData[k]) return artworkData[k];
  }
  if (artworkData[englishName]) return artworkData[englishName];
  return null;
}

function getPreviewArt(d) {
  const arts = findArtForFeature(d);
  if (!arts || arts.length === 0) return null;
  return arts[0];
}

function showHoverPreview(d, event) {
  try {
    if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;

    const art = getPreviewArt(d);
    if (!art) return;

    hoverPreviewEl.innerHTML = '';
    const img = document.createElement('img');
    img.src = art.url;
    img.alt = art.title || '';

    const meta = document.createElement('div');
    meta.className = 'hp-meta';
    const title = document.createElement('div');
    title.className = 'hp-title';
    title.textContent = art.title || '';
    const year = document.createElement('div');
    year.className = 'hp-year';
    year.textContent = art.year ? String(art.year) : '';
    meta.appendChild(title);
    meta.appendChild(year);

    hoverPreviewEl.appendChild(img);
    hoverPreviewEl.appendChild(meta);

    updateHoverPreviewPosition(event);
    hoverPreviewEl.classList.add('visible');
    hoverPreviewEl.setAttribute('aria-hidden', 'false');
  } catch (e) {
    console.error('hover preview error', e);
  }
}

function updateHoverPreviewPosition(event) {
  if (!hoverPreviewEl) return;
  const padding = 12;
  const boxW = hoverPreviewEl.offsetWidth || 260;
  const boxH = hoverPreviewEl.offsetHeight || 100;
  let x = (event.pageX || event.clientX + window.scrollX) + 18;
  let y = (event.pageY || event.clientY + window.scrollY) + 18;

  const winW = window.innerWidth;
  const winH = window.innerHeight;

  if (x + boxW + padding > winW) {
    x = (event.pageX || event.clientX + window.scrollX) - boxW - 18;
  }
  if (y + boxH + padding > (window.scrollY + winH)) {
    y = (event.pageY || event.clientY + window.scrollY) - boxH - 18;
  }

  hoverPreviewEl.style.left = x + 'px';
  hoverPreviewEl.style.top = y + 'px';
}

function hideHoverPreview() {
  if (!hoverPreviewEl) return;
  hoverPreviewEl.classList.remove('visible');
  hoverPreviewEl.setAttribute('aria-hidden', 'true');
}

function showArtworksForCountry(d) {
  showSidebar();

  const englishName = getCountryDisplayName(d);
  const localized = getLocalizedDisplay(d);
  const key = getCountryKey(d);
  const possibleKeys = [key, (key || '').toUpperCase(), (key || '').toLowerCase(), englishName, propNameToEnglish(englishName)];
  let arts = null;

  for (const k of possibleKeys) {
    if (!k) continue;
    if (artworkData[k]) {
      arts = artworkData[k];
      break;
    }
  }

  if (!arts && artworkData[englishName]) arts = artworkData[englishName];

  const container = document.getElementById('countryInfo');
  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'detail-header';

  const title = document.createElement('h3');
  title.className = 'country-title';
  title.textContent = localized;

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-close';
  backBtn.textContent = '回到地圖';
  backBtn.onclick = () => clearSelection();

  header.appendChild(title);
  header.appendChild(backBtn);
  container.appendChild(header);

  if (!arts || arts.length === 0) {
    const p = document.createElement('p');
    p.className = 'no-art';
    p.textContent = '該國家暫無畫作，您可以在 artworkData 中加入對應作品。';
    container.appendChild(p);
    return;
  }

  const list = document.createElement('div');
  list.className = 'art-list';

  arts.forEach((art, idx) => {
    const item = document.createElement('div');
    item.className = 'art-item';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = art.url;
    img.alt = art.title || '';
    img.onclick = () => openModal(art);

    const meta = document.createElement('div');
    meta.className = 'art-meta';

    const titleLink = document.createElement('span');
    titleLink.className = 'wiki-link';
    titleLink.textContent = art.title || 'Untitled';
    titleLink.onclick = () => showSubpage(englishName, idx, arts);

    const year = document.createElement('div');
    year.className = 'art-year';
    year.textContent = art.year ? String(art.year) : '';

    const desc = document.createElement('div');
    desc.className = 'art-desc';
    desc.textContent = art.desc || '';

    meta.appendChild(titleLink);
    meta.appendChild(year);
    meta.appendChild(desc);
    item.appendChild(img);
    item.appendChild(meta);
    list.appendChild(item);
  });

  container.appendChild(list);
}

function showSubpage(countryEnglishName, artIndex, arts) {
  showSidebar();

  const container = document.getElementById('countryInfo');
  const art = arts[artIndex];
  if (!art) return;

  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'detail-header';

  const title = document.createElement('h3');
  title.className = 'country-title';
  title.textContent = art.title || countryEnglishName;

  const back = document.createElement('button');
  back.className = 'mini-link';
  back.textContent = '← 返回列表';
  back.onclick = () => {
    const features = svg.selectAll('path').data();
    const feature = features.find(f => getCountryDisplayName(f) === countryEnglishName);
    if (feature) showArtworksForCountry(feature);
    else {
      document.getElementById('countryInfo').innerHTML = '<p class="no-art">無法找到該國家的地圖資料。</p>';
    }
    history.pushState(null, '', '#');
  };

  header.appendChild(title);
  header.appendChild(back);
  container.appendChild(header);

  const detail = document.createElement('div');
  detail.className = 'detail-container';

  const img = document.createElement('img');
  img.className = 'detail-image';
  img.src = art.url;
  img.alt = art.title || '';
  img.onclick = () => openModal(art);

  const desc = document.createElement('p');
  desc.className = 'detail-text';
  desc.textContent = art.desc || '';

  if (art.year) {
    const year = document.createElement('p');
    year.className = 'detail-text';
    year.textContent = '年份：' + art.year;
    detail.appendChild(year);
  }

  detail.appendChild(img);
  detail.appendChild(desc);
  container.appendChild(detail);

  history.pushState(null, '', `#art/${encodeURIComponent(countryEnglishName)}/${artIndex}`);
}

function openModal(art) {
  const modalContent = document.getElementById('modalContent');
  modalContent.innerHTML = '';

  const h = document.createElement('h3');
  h.textContent = art.title || '';

  const img = document.createElement('img');
  img.src = art.url;
  img.alt = art.title || '';

  const p = document.createElement('p');
  p.textContent = art.desc || '';

  modalContent.appendChild(h);
  modalContent.appendChild(img);
  modalContent.appendChild(p);
  document.getElementById('modal').style.display = 'flex';
}

let modalTouchStartY = null;
document.getElementById('modal').addEventListener('touchstart', (e) => {
  if (e.touches && e.touches[0]) modalTouchStartY = e.touches[0].clientY;
});
document.getElementById('modal').addEventListener('touchmove', (e) => {
  if (!modalTouchStartY) return;
  const y = e.touches[0].clientY;
  const diff = y - modalTouchStartY;
  if (diff > 120) {
    closeModal();
    modalTouchStartY = null;
  }
});

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function clearSelection() {
  g.selectAll('.country').classed('selected', false);
  document.getElementById('countryInfo').innerHTML = '<p class="no-art">點選地圖上的國家以查看對應畫作。</p>';
  hideSidebar();
  history.pushState(null, '', '#');
}

function handleHashOnLoad() {
  const hash = location.hash || '';
  if (!hash) return;
  const match = hash.match(/^#art\/(.+)\/(\d+)$/);
  if (!match) return;

  const countryName = decodeURIComponent(match[1]);
  const artIndex = Number(match[2]);

  const tryShow = () => {
    const features = svg.selectAll('path').data();
    if (!features || features.length === 0) {
      setTimeout(tryShow, 200);
      return;
    }

    const feature = features.find(f => {
      const name = getCountryDisplayName(f);
      const key = getCountryKey(f);
      return name === countryName || key === countryName || (f.properties && (f.properties.name === countryName || f.properties.ADMIN === countryName));
    });

    if (feature) {
      g.selectAll('.country').classed('selected', false);
      svg.selectAll('path')
        .filter(d => getCountryDisplayName(d) === countryName || getCountryKey(d) === countryName)
        .classed('selected', true);

      showSidebar();

      const arts = artworkData[getCountryKey(feature)] || artworkData[getCountryDisplayName(feature)] || artworkData[feature.properties?.name];
      if (arts && arts[artIndex]) {
        showSubpage(getCountryDisplayName(feature), artIndex, arts);
      } else {
        showArtworksForCountry(feature);
      }
    }
  };

  tryShow();
}

document.getElementById('clearBtn').addEventListener('click', clearSelection);
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

let isTouchingMap = false;
const mapEl = document.getElementById('map');
mapEl.addEventListener('touchstart', () => { isTouchingMap = true; }, { passive: true });
mapEl.addEventListener('touchend', () => { isTouchingMap = false; }, { passive: true });

hideSidebar();
renderMap();
handleHashOnLoad();
</script>
</body>
</html>
