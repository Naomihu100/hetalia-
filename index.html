<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>按國家展示畫作 — Hetalia</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --line: #dfe7f1;
    --text: #1f2937;
    --muted: #6b7280;
    --link: #0645ad;
    --link-hover: #0a3d91;
    --map-fill: #e5e7eb;
    --map-hover: #b3d4ff;
    --map-selected: #4a90e2;
    --zoom-btn-bg: rgba(255,255,255,0.9);
    --zoom-btn-shadow: 0 6px 18px rgba(12,18,31,0.08);
    --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
    --shadow-card: 0 10px 24px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #container { display:flex; height:100vh; width:100%; }
  #map {
    flex: 1;
    min-width: 0;
    position: relative;
    background: linear-gradient(180deg, #f0f6ff 0%, #e5f0ff 100%);
  }
  svg { width:100%; height:100%; display:block; touch-action: none; }

  .country {
    fill: var(--map-fill);
    stroke: #ffffff;
    stroke-width: 0.5;
    cursor: pointer;
    transition: fill 0.15s ease, opacity 0.3s ease;
  }
  .country:hover { fill: var(--map-hover); }
  .country.selected { fill: var(--map-selected); }

  /* 歷史圖層樣式：精確路徑 hover 與點擊 */
  .historical-layer path {
    cursor: pointer;
    stroke-width: 1.2;
    stroke: rgba(255, 255, 255, 0.9);
    transition: all 0.2s ease;
    filter: drop-shadow(0px 3px 8px rgba(0,0,0,0.25));
    pointer-events: all;
  }
  .historical-layer path:hover {
    filter: drop-shadow(0px 5px 14px rgba(0,0,0,0.4));
    opacity: 0.95;
  }

  .layer-controls {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: min(520px, calc(100% - 110px));
  }
  .layer-btn {
    appearance: none;
    border: 1px solid rgba(15, 23, 42, 0.12);
    background: rgba(255,255,255,0.92);
    color: var(--text);
    box-shadow: 0 4px 12px rgba(15,23,42,0.06);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .layer-btn:hover {
    transform: translateY(-1px);
    background: #ffffff;
  }
  .layer-btn.active {
    background: #1e293b;
    color: #ffffff;
    border-color: #1e293b;
    box-shadow: 0 4px 14px rgba(30, 41, 59, 0.25);
  }

  /* 側邊欄樣式與彈跳動畫 */
  #sidebar {
    display: none;
    position: relative;
    width: 360px;
    max-width: 40vw;
    flex-shrink: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-left: 1px solid rgba(148,163,184,0.18);
    box-shadow: -12px 0 32px rgba(15, 23, 42, 0.12);
    padding: 18px;
    overflow: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateX(120%) scale(0.96);
    transition: opacity 220ms ease, transform 220ms ease, visibility 220ms;
    pointer-events: none;
    border-radius: 24px 0 0 24px;
  }

  #sidebar.visible {
    display: block;
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  @keyframes sidebarBounce {
    0% { opacity: 0; transform: translateX(18px) scale(0.96); }
    52% { opacity: 1; transform: translateX(-6px) scale(1.01); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  #sidebar.panel-bounce {
    animation: sidebarBounce 260ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }

  .sidebar-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eef2f7;
  }
  #sidebar h2 { margin:0; font-size: 1.08rem; letter-spacing: 0.02em; }

  .btn-close {
    background: #eef2f7;
    border: 1px solid #dbe3ec;
    border-radius: 10px;
    padding: 7px 11px;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn-close:hover { background: #e4ebf5; transform: translateY(-1px); }

  .country-panel {
    background: #f8fafc;
    border: 1px solid #edf2f7;
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow-card);
  }

  .no-art { color: var(--muted); padding: 12px 0; margin: 0; line-height: 1.6; }
  .country-title { font-size: 1.08rem; margin: 0 0 10px; line-height: 1.4; }
  .art-list { display:flex; flex-direction:column; gap:12px; }

  .art-item {
    display:flex;
    gap:12px;
    padding: 10px 8px;
    border-radius: 14px;
    border: 1px solid #eef2f7;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 2px 8px rgba(15,23,42,0.02);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .art-item:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(15,23,42,0.06);
  }

  .thumb {
    width: 96px;
    height: 72px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid #e5e7eb;
    flex-shrink: 0;
  }
  .art-meta { flex: 1; min-width: 0; }
  .wiki-link {
    display:inline-block;
    color: var(--link);
    text-decoration: none;
    cursor: pointer;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .wiki-link:hover { color: var(--link-hover); }
  .art-year { color: var(--muted); font-size: 0.8rem; }
  .art-desc { color: var(--text); font-size: 0.88rem; line-height: 1.5; margin-top: 5px; }

  .hover-preview {
    position: absolute;
    pointer-events: none;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(14, 41, 77, 0.12);
    box-shadow: 0 8px 24px rgba(12,18,31,0.15);
    border-radius: 10px;
    overflow: hidden;
    width: 260px;
    display: flex;
    gap: 10px;
    padding: 10px;
    align-items: center;
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 60;
  }
  .hover-preview.visible { opacity: 1; transform: translateY(0) scale(1); }
  .hover-preview img { width: 100px; height: 70px; object-fit: cover; border-radius: 6px; }
  .hover-preview .hp-meta { display:flex; flex-direction:column; gap:4px; }
  .hover-preview .hp-title { font-weight: 700; font-size: 0.9rem; color: var(--text); }
  .hover-preview .hp-year { color: var(--muted); font-size: 0.8rem; }

  .zoom-controls {
    position: absolute;
    right: 12px;
    top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 50;
  }
  .zoom-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--zoom-btn-bg);
    box-shadow: var(--zoom-btn-shadow);
    border: 1px solid #e6eef8;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    font-weight: 600;
  }

  #tooltip {
    position:absolute;
    pointer-events:none;
    background: rgba(15, 23, 42, 0.85);
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    display:none;
    z-index: 70;
  }

  #modal {
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(15, 23, 42, 0.6);
    z-index:100;
    padding: 24px;
  }
  #modal .modal-inner {
    background:#fff;
    padding: 20px;
    border-radius: 18px;
    max-width: 90vw;
    max-height: 90vh;
    overflow:auto;
  }
  #modal img { max-width:100%; height:auto; display:block; border-radius: 10px; }
</style>
</head>
<body>
<div id="container">
  <div id="map">
    <div id="tooltip"></div>
    <div id="hoverPreview" class="hover-preview" aria-hidden="true"></div>
    <div id="layerControls" class="layer-controls" aria-label="歷史圖層選擇">
      <button class="layer-btn active" data-layer="modern">現代</button>
      <button class="layer-btn" data-layer="romanEmpire">羅馬帝國全盛期</button>
      <button class="layer-btn" data-layer="britishEmpire">大英帝國</button>
      <button class="layer-btn" data-layer="prussia">普魯士王國</button>
      <button class="layer-btn" data-layer="japaneseEmpire">大日本帝國</button>
    </div>
  </div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>請選擇一個國家或歷史版圖</h2>
      <button id="clearBtn" class="btn-close">清除</button>
    </div>
    <div id="countryInfo" class="country-panel">
      <p class="no-art">點選地圖上的國家以查看對應畫作。</p>
    </div>
  </aside>
</div>

<div class="zoom-controls">
  <button id="zoomIn" class="zoom-btn" aria-label="放大">+</button>
  <button id="zoomOut" class="zoom-btn" aria-label="縮小">−</button>
  <button id="zoomReset" class="zoom-btn" aria-label="重置">◯</button>
</div>

<div id="modal" aria-hidden="true">
  <div class="modal-inner">
    <button id="closeModal" class="btn-close" style="float:right">關閉</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const geojsonUrl = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';

// 國家數字代碼轉 ISO2 縮寫
const numericCountryToIso2 = {
  '156': 'CN', '392': 'JP', '250': 'FR', '840': 'US', '124': 'CA', '276': 'DE',
  '826': 'GB', '380': 'IT', '643': 'RU', '356': 'IN', '710': 'ZA', '76': 'BR',
  '484': 'MX', '032': 'AR', '036': 'AU', '554': 'NZ', '704': 'VN', '764': 'TH',
  '702': 'SG', '360': 'ID', '458': 'MY', '608': 'PH', '410': 'KR', '804': 'UA',
  '398': 'KZ', '050': 'BD', '344': 'HK', '528': 'NL', '724': 'ES', '752': 'SE',
  '203': 'CZ', '756': 'CH', '158': 'TW', '246': 'FI'
};

// 英文名轉中文顯示名稱
const englishToChinese = {
  'China': '中國', 'Japan': '日本', 'United States': '美國', 'France': '法國',
  'Germany': '德國', 'United Kingdom': '英國', 'South Korea': '韓國', 'Italy': '義大利',
  'Spain': '西班牙', 'Russia': '俄羅斯', 'Canada': '加拿大', 'Australia': '澳大利亞',
  'Taiwan': '台灣', 'Finland': '芬蘭'
};

// 現代國家的畫作資料 (artworkData)
const artworkData = {
  "CN": [{ title: "中國的記憶", url: "China.png", year: 2026, desc: "關於中國的畫作與記憶" }],
  "DE": [{ title: "德國的記憶", url: "Germany.png", year: 2026, desc: "關於德國的畫作與記憶" }],
  "FR": [{ title: "法國的記憶", url: "france.png", year: 2026, desc: "關於法國的畫作與記憶" }],
  "JP": [
    { title: "日本的記憶", url: "Japan.png", year: 2024, desc: "關於日本的記憶" },
    { title: "日本的記憶 - 生日", url: "japan birthday.jpg", year: 2026, desc: "關於日本生日的畫作與記憶" }
  ],
  "CA": [{ title: "加拿大的記憶", url: "canda1.png", year: 2026, desc: "關於加拿大的畫作與記憶" }],
  "US": [{ title: "美國的記憶", url: "american.png", year: 2021, desc: "關於美國的畫作與記憶" }],
  "ES": [{ title: "西班牙的記憶", url: "spain.jpg", year: 2026, desc: "關於西班牙的畫作與記憶" }],
  "TW": [
    { title: "台灣的記憶 - 新年", url: "taiwan newyear.jpg", year: 2026, desc: "關於台灣新年的畫作與記憶" },
    { title: "台灣的記憶 - 中秋/月夜", url: "taiwan moon.jpg", year: 2026, desc: "關於台灣月夜與中秋的畫作與記憶" },
    { title: "台灣的記憶 - 生日", url: "taiwan happybirthday.png", year: 2026, desc: "關於台灣生日的畫作與記憶" }
  ],
  "FI": [{ title: "芬蘭的記憶", url: "finland.jpg", year: 2026, desc: "關於芬蘭的畫作與記憶" }],
  "IT": [
    { title: "義大利的記憶 - 威尼斯", url: "italy venice.jpg", year: 2026, desc: "關於義大利威尼斯的畫作與記憶" },
    { title: "義大利的記憶 - 1P", url: "italy 1p.jpg", year: 2026, desc: "關於義大利（1P）的畫作與記憶" },
    { title: "義大利的記憶 - 2P", url: "italy 2p.jpg", year: 2026, desc: "關於義大利（2P/異色）的畫作與記憶" }
  ]
};

// 🌟 歷史圖層專屬畫作資料庫
const historicalArtworkData = {
  "japaneseEmpire": [
    { title: "大日本帝國的記憶", url: "empire of japan.jpg", year: 2026, desc: "大日本帝國時期的歷史畫作與記憶" }
  ],
  "britishEmpire": [
    { title: "大英帝國的記憶", url: "british.jpg", year: 2026, desc: "大英帝國全盛時期的歷史畫作與記憶" }
  ],
  "romanEmpire": [],
  "prussia": []
};

const layerDefinitions = [
  { id: 'modern', label: '現代', visible: true, color: '#e5e7eb' },
  { id: 'romanEmpire', label: '羅馬帝國全盛期', visible: false, color: 'rgba(239, 68, 68, 0.45)', focus: { center: [15, 42], scale: 3.2 } },
  { id: 'britishEmpire', label: '大英帝國', visible: false, color: 'rgba(59, 130, 246, 0.55)', focus: { center: [20, 10], scale: 1.2 } },
  { id: 'prussia', label: '普魯士王國', visible: false, color: 'rgba(34, 197, 94, 0.5)', focus: { center: [16, 52], scale: 5.5 } },
  { id: 'japaneseEmpire', label: '大日本帝國', visible: false, color: 'rgba(249, 115, 22, 0.45)', focus: { center: [135, 35], scale: 3.8 } }
];

const layerStates = Object.fromEntries(layerDefinitions.map(layer => [layer.id, layer]));

const historicalLayersGeoJSON = {
  romanEmpire: {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      geometry: {
        type: "Polygon",
        coordinates: [[[-9.5, 38.7], [-8.9, 43.5], [-1.5, 43.4], [3.2, 51.2], [10.2, 53.8], [19.1, 54.4], [27.5, 44.2], [35.2, 41.0], [42.0, 37.5], [36.0, 32.5], [32.5, 29.9], [25.0, 31.5], [12.5, 32.8], [-5.6, 36.0], [-9.5, 38.7]]]
      }
    }]
  },
  britishEmpire: {
    type: "FeatureCollection",
    features: [
      // 1. 不列顛群島
      { type: "Feature", geometry: { type: "Polygon", coordinates: [[[-10.2, 51.5], [-6.2, 58.6], [-3.1, 58.7], [1.8, 52.8], [1.4, 50.7], [-5.2, 50.0], [-10.2, 51.5]]] }},
      // 2. 加拿大區域
      { type: "Feature", geometry: { type: "Polygon", coordinates: [[[-140, 60], [-60, 60], [-60, 45], [-125, 49], [-140, 60]]] }},
      // 3. 印度區域
      { type: "Feature", geometry: { type: "Polygon", coordinates: [[[68, 35], [89, 26], [92, 10], [72, 8], [68, 35]]] }},
      // 4. 澳洲區域
      { type: "Feature", geometry: { type: "Polygon", coordinates: [[[112, -12], [153, -12], [153, -38], [112, -35], [112, -12]]] }}
    ]
  },
  prussia: {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      geometry: {
        type: "Polygon",
        coordinates: [[[6.1, 50.7], [12.0, 54.3], [21.0, 55.7], [22.8, 54.4], [19.0, 50.0], [14.5, 50.2], [7.5, 49.2], [6.1, 50.7]]]
      }
    }]
  },
  japaneseEmpire: {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      geometry: {
        type: "Polygon",
        coordinates: [[[120.0, 22.0], [122.0, 25.0], [129.0, 35.0], [130.0, 42.0], [142.0, 50.0], [145.0, 43.0], [135.0, 34.0], [126.0, 33.0], [120.0, 22.0]]]
      }
    }]
  }
};

const width = Math.max(700, window.innerWidth * 0.6);
const height = Math.max(400, window.innerHeight);
const svg = d3.select("#map").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

const g = svg.append('g').attr('id', 'map-group');
const countriesGroup = g.append('g').attr('id', 'countries');
const historicalLayerGroup = g.append('g').attr('id', 'historical-layer-group');

const tooltip = d3.select("#tooltip");
const hoverPreviewEl = document.getElementById('hoverPreview');

const projection = d3.geoMercator()
  .scale((width / 2 / Math.PI) * 1.1)
  .translate([width / 2, height / 1.8]);
const path = d3.geoPath().projection(projection);

let zoomBehavior;
let currentActiveLayer = 'modern';
const sidebarEl = document.getElementById('sidebar');

function triggerSidebarBounce() {
  sidebarEl.classList.remove('panel-bounce');
  void sidebarEl.offsetWidth;
  sidebarEl.classList.add('panel-bounce');
}

function showSidebar() {
  sidebarEl.style.display = 'block';
  sidebarEl.classList.add('visible');
  triggerSidebarBounce();
}

function hideSidebar() {
  sidebarEl.classList.remove('visible', 'panel-bounce');
  sidebarEl.style.display = 'none';
}

function renderHistoricalLayers() {
  Object.keys(historicalLayersGeoJSON).forEach((layerId) => {
    const layerData = historicalLayersGeoJSON[layerId];
    const layerConfig = layerStates[layerId];

    historicalLayerGroup.append('g')
      .attr('class', `historical-layer historical-${layerId}`)
      .style('display', 'none')
      .selectAll('path')
      .data(layerData.features)
      .join('path')
      .attr('d', path)
      .attr('fill', layerConfig.color)
      .attr('stroke', '#ffffff')
      .attr('stroke-width', 1.2)
      .on("mouseover", (event) => {
        tooltip.style("display", "block").text(layerConfig.label);
        showHistoricalHoverPreview(layerId, event);
      })
      .on("mousemove", (event) => {
        tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY + 12) + "px");
        updateHoverPreviewPosition(event);
      })
      .on("mouseout", () => {
        tooltip.style("display", "none");
        hideHoverPreview();
      })
      .on("click", (event) => {
        event.stopPropagation();
        showArtworksForHistoricalLayer(layerId, layerConfig.label);
      });
  });
}

function zoomToLocation(center, scaleFactor) {
  const [lon, lat] = center;
  const projectedPoint = projection([lon, lat]);
  const transform = d3.zoomIdentity
    .translate(width / 2, height / 1.8)
    .scale(scaleFactor)
    .translate(-projectedPoint[0], -projectedPoint[1]);

  svg.transition()
    .duration(800)
    .ease(d3.easeCubicInOut)
    .call(zoomBehavior.transform, transform);
}

function syncHistoricalLayerVisibility(activeLayerId) {
  currentActiveLayer = activeLayerId;
  Object.keys(layerStates).forEach((layerId) => {
    const isTarget = (layerId === activeLayerId);
    const layerEl = historicalLayerGroup.select(`.historical-${layerId}`);

    if (!layerEl.empty()) {
      if (isTarget && layerId !== 'modern') {
        layerEl.style('display', 'block').style('opacity', 0).transition().duration(300).style('opacity', 1);
        layerStates[layerId].visible = true;

        if (layerStates[layerId].focus) {
          zoomToLocation(layerStates[layerId].focus.center, layerStates[layerId].focus.scale);
        }
      } else {
        layerEl.style('display', 'none');
        layerStates[layerId].visible = false;
      }
    }
  });

  if (activeLayerId === 'modern') {
    svg.transition().duration(600).call(zoomBehavior.transform, d3.zoomIdentity);
  }
}

function attachLayerControls() {
  document.querySelectorAll('.layer-btn').forEach((button) => {
    button.addEventListener('click', () => {
      const layerId = button.dataset.layer;
      if (!layerId) return;

      document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');

      syncHistoricalLayerVisibility(layerId);
    });
  });
}

function renderMap() {
  d3.json(geojsonUrl).then(world => {
    const countries = topojson.feature(world, world.objects.countries);

    countriesGroup.selectAll("path")
      .data(countries.features)
      .join("path")
        .attr("class", "country")
        .attr("d", path)
        .on("mouseover", (event, d) => {
          if (currentActiveLayer !== 'modern') return;
          d3.select(event.currentTarget).raise();
          tooltip.style("display", "block").text(getLocalizedDisplay(d));
          showHoverPreview(d, event);
        })
        .on("mousemove", (event) => {
          if (currentActiveLayer !== 'modern') return;
          tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY + 12) + "px");
          updateHoverPreviewPosition(event);
        })
        .on("mouseout", () => {
          tooltip.style("display", "none");
          hideHoverPreview();
        })
        .on("click", (event, d) => {
          if (currentActiveLayer !== 'modern') return;
          countriesGroup.selectAll(".country").classed("selected", false);
          d3.select(event.currentTarget).classed("selected", true);
          showArtworksForCountry(d);
        });

    zoomBehavior = d3.zoom()
      .scaleExtent([1, 10])
      .on('zoom', (event) => {
        g.attr('transform', event.transform);
        countriesGroup.selectAll('.country').style('stroke-width', (0.5 / event.transform.k));
      });

    svg.call(zoomBehavior);
    renderHistoricalLayers();
    attachZoomControls();
    attachLayerControls();

  }).catch(err => {
    console.error('地圖載入錯誤:', err);
  });
}

function getNumericIso2(d) {
  const id = String(d && d.id || '');
  return numericCountryToIso2[id] || null;
}

function getCountryKey(d) {
  return getNumericIso2(d) || (d && d.properties ? d.properties.name : null);
}

function getCountryDisplayName(d) {
  const props = d && d.properties ? d.properties : {};
  return props.name || getCountryKey(d) || '';
}

function getLocalizedDisplay(d) {
  const en = getCountryDisplayName(d);
  const zh = englishToChinese[en] || null;
  return zh ? `${zh} (${en})` : en;
}

function attachZoomControls() {
  document.getElementById('zoomIn').addEventListener('click', () => svg.transition().duration(250).call(zoomBehavior.scaleBy, 1.4));
  document.getElementById('zoomOut').addEventListener('click', () => svg.transition().duration(250).call(zoomBehavior.scaleBy, 1 / 1.4));
  document.getElementById('zoomReset').addEventListener('click', () => svg.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity));
}

function showArtworksForCountry(d) {
  showSidebar();
  const key = getCountryKey(d);
  const localized = getLocalizedDisplay(d);
  const arts = artworkData[key] || artworkData[getCountryDisplayName(d)];

  renderArtListInSidebar(localized, arts);
}

function showArtworksForHistoricalLayer(layerId, layerLabel) {
  showSidebar();
  const arts = historicalArtworkData[layerId] || [];
  renderArtListInSidebar(layerLabel, arts);
}

function renderArtListInSidebar(titleName, arts) {
  const container = document.getElementById('countryInfo');
  container.innerHTML = `<div class="detail-header"><h3 class="country-title">${titleName}</h3><button class="btn-close" onclick="clearSelection()">回到地圖</button></div>`;

  if (!arts || arts.length === 0) {
    container.innerHTML += '<p class="no-art">該時期或版圖暫無畫作紀錄。</p>';
    return;
  }

  const list = document.createElement('div');
  list.className = 'art-list';
  arts.forEach(art => {
    list.innerHTML += `
      <div class="art-item">
        <img class="thumb" src="${art.url}" alt="${art.title}" onclick="openModal('${art.url}', '${art.title}')">
        <div class="art-meta">
          <span class="wiki-link">${art.title}</span>
          <div class="art-year">${art.year}年</div>
          <div class="art-desc">${art.desc}</div>
        </div>
      </div>
    `;
  });
  container.appendChild(list);
}

function showHoverPreview(d, event) {
  const arts = artworkData[getCountryKey(d)] || artworkData[getCountryDisplayName(d)];
  if (!arts || !arts[0]) return;
  const art = arts[0];
  hoverPreviewEl.innerHTML = `<img src="${art.url}"><div class="hp-meta"><div class="hp-title">${art.title}</div><div class="hp-year">${art.year}</div></div>`;
  hoverPreviewEl.classList.add('visible');
  updateHoverPreviewPosition(event);
}

function showHistoricalHoverPreview(layerId, event) {
  const arts = historicalArtworkData[layerId];
  if (!arts || !arts[0]) return;
  const art = arts[0];
  hoverPreviewEl.innerHTML = `<img src="${art.url}"><div class="hp-meta"><div class="hp-title">${art.title}</div><div class="hp-year">${art.year}</div></div>`;
  hoverPreviewEl.classList.add('visible');
  updateHoverPreviewPosition(event);
}

function updateHoverPreviewPosition(event) {
  if (!hoverPreviewEl) return;
  hoverPreviewEl.style.left = (event.pageX + 15) + 'px';
  hoverPreviewEl.style.top = (event.pageY + 15) + 'px';
}

function hideHoverPreview() {
  if (hoverPreviewEl) hoverPreviewEl.classList.remove('visible');
}

function openModal(url, title) {
  document.getElementById('modalContent').innerHTML = `<h3>${title}</h3><img src="${url}">`;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function clearSelection() {
  countriesGroup.selectAll('.country').classed('selected', false);
  document.getElementById('countryInfo').innerHTML = '<p class="no-art">點選地圖上的國家或歷史版圖以查看對應畫作。</p>';
  hideSidebar();
}

document.getElementById('clearBtn').addEventListener('click', clearSelection);
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

hideSidebar();
renderMap();
</script>
</body>
</html>
