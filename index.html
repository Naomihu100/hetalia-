<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>按國家展示畫作 — Hetalia</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --line: #dfe7f1;
    --text: #1f2937;
    --muted: #6b7280;
    --link: #0645ad;
    --link-hover: #0a3d91;
    --map-fill: #dcdcdc;
    --map-hover: #b3d4ff;
    --map-selected: #4a90e2;
    --zoom-btn-bg: rgba(255,255,255,0.9);
    --zoom-btn-shadow: 0 6px 18px rgba(12,18,31,0.08);
    --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
    --shadow-card: 0 10px 24px rgba(15, 23, 42, 0.08);
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #container { display:flex; height:100vh; width:100%; }
  #map {
    flex: 1;
    min-width: 0;
    position: relative;
    background: linear-gradient(180deg, #f7fbff 0%, #edf5ff 100%);
  }
  svg { width:100%; height:100%; display:block; touch-action: none; }

  .country {
    fill: var(--map-fill);
    stroke: #fff;
    stroke-width: 0.5;
    cursor: pointer;
    transition: fill 0.15s ease;
  }
  .country:hover { fill: var(--map-hover); }
  .country.selected { fill: var(--map-selected); }

  .historical-layer {
    pointer-events: none;
    stroke: rgba(255,255,255,0.9);
    stroke-width: 1;
    transition: opacity 180ms ease;
  }

  .layer-controls {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: min(460px, calc(100% - 110px));
  }
  .layer-btn {
    appearance: none;
    border: 1px solid rgba(15, 23, 42, 0.08);
    background: rgba(255,255,255,0.9);
    color: var(--text);
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .layer-btn:hover {
    transform: translateY(-1px);
  }
  .layer-btn.active {
    background: #111827;
    color: #fff;
    border-color: #111827;
  }

  #sidebar {
    display: none;
    position: relative;
    width: 360px;
    max-width: 40vw;
    flex-shrink: 0;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(10px);
    border-left: 1px solid rgba(148,163,184,0.18);
    box-shadow: -12px 0 32px rgba(15, 23, 42, 0.12);
    padding: 18px 18px 20px 18px;
    overflow: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateX(120%) scale(0.96);
    transition: opacity 220ms ease, transform 220ms ease, visibility 220ms;
    pointer-events: none;
    border-radius: 24px 0 0 24px;
    margin-left: 8px;
  }

  #sidebar.visible {
    display: block;
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  @keyframes sidebarBounce {
    0% {
      opacity: 0;
      transform: translateX(18px) scale(0.96);
    }
    52% {
      opacity: 1;
      transform: translateX(-6px) scale(1.01);
    }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  #sidebar.panel-bounce {
    animation: sidebarBounce 260ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }

  .sidebar-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eef2f7;
  }
  #sidebar h2 {
    margin:0;
    font-size: 1.08rem;
    letter-spacing: 0.02em;
  }

  .btn-close, .mini-link {
    background: #eef2f7;
    border: 1px solid #dbe3ec;
    border-radius: 10px;
    padding: 7px 11px;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn-close:hover, .mini-link:hover {
    background: #e4ebf5;
    transform: translateY(-1px);
  }

  .country-panel {
    background: #f8fafc;
    border: 1px solid #edf2f7;
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow-card);
  }

  .no-art {
    color: var(--muted);
    padding: 12px 0;
    margin: 0;
    line-height: 1.6;
  }

  .country-title {
    font-size: 1.08rem;
    margin: 0 0 10px;
    line-height: 1.4;
  }

  .art-list {
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .art-item {
    display:flex;
    gap:12px;
    padding: 10px 8px;
    border-radius: 14px;
    border: 1px solid #eef2f7;
    background: rgba(255,255,255,0.5);
    box-shadow: 0 2px 8px rgba(15,23,42,0.02);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .art-item:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(15,23,42,0.06);
  }

  .thumb {
    width: 96px;
    height: 72px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid #e5e7eb;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .art-meta { flex: 1; min-width: 0; }
  .wiki-link {
    display:inline-block;
    color: var(--link);
    text-decoration: none;
    cursor: pointer;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .wiki-link:hover { color: var(--link-hover); }
  .art-year {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }
  .art-desc {
    color: var(--text);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-top: 7px;
  }

  .detail-container {
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .detail-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom: 8px;
  }
  .detail-image {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 14px;
    background: #f8f9fb;
    border: 1px solid #edf1f5;
    box-shadow: var(--shadow-card);
  }
  .detail-text {
    line-height: 1.7;
    color: var(--text);
    margin: 0;
  }

  .hover-preview {
    position: absolute;
    pointer-events: none;
    background: linear-gradient(180deg, #ffffff, #f8fbff);
    border: 1px solid rgba(14, 41, 77, 0.08);
    box-shadow: 0 8px 24px rgba(12,18,31,0.12);
    border-radius: 10px;
    overflow: hidden;
    width: 260px;
    max-width: 38vw;
    display: flex;
    gap: 10px;
    padding: 10px;
    align-items: center;
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 60;
  }
  .hover-preview.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .hover-preview img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #eef2f7; }
  .hover-preview .hp-meta { display:flex; flex-direction:column; gap:6px; }
  .hover-preview .hp-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
  .hover-preview .hp-year { color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 800px), (hover: none) {
    .hover-preview { display: none !important; }
  }

  .zoom-controls {
    position: absolute;
    right: 12px;
    top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 50;
  }
  .zoom-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--zoom-btn-bg);
    box-shadow: var(--zoom-btn-shadow);
    border: 1px solid #e6eef8;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    font-weight: 600;
    user-select: none;
  }
  .zoom-btn:active { transform: scale(0.98); }

  #tooltip {
    position:absolute;
    pointer-events:none;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13px;
    display:none;
    z-index: 10;
  }

  #modal {
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(15, 23, 42, 0.52);
    z-index:30;
    padding: 24px;
  }
  #modal .modal-inner {
    background:#fff;
    padding: 18px;
    border-radius: 18px;
    max-width: 90vw;
    max-height: 90vh;
    overflow:auto;
    box-shadow: 0 22px 48px rgba(15,23,42,0.24);
  }
  #modal img {
    max-width:100%;
    height:auto;
    display:block;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
  }

  @media (max-width: 800px) {
    #container { flex-direction:column; }
    #sidebar {
      display: none;
      width: 100%;
      max-width: 100%;
      margin-left: 0;
      border-left:none;
      border-top:1px solid rgba(148,163,184,0.18);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -12px 28px rgba(15,23,42,0.08);
    }
    #sidebar.visible {
      display: block;
      width: 100%;
      max-width: 100%;
      max-height: 48vh;
      padding: 16px;
    }
    .art-item { padding: 9px; }
    .thumb { width: 120px; height: 90px; }
    .wiki-link { font-size: 1rem; }
    .zoom-btn { width: 52px; height: 52px; border-radius: 12px; }
    #modal .modal-inner {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
      padding: 12px 12px 24px 12px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:stretch;
    }
    #modal img { max-height: calc(100vh - 200px); object-fit: contain; }
  }
</style>
</head>
<body>
<div id="container">
  <div id="map">
    <div id="tooltip"></div>
    <div id="hoverPreview" class="hover-preview" aria-hidden="true"></div>
    <div id="layerControls" class="layer-controls" aria-label="歷史圖層選擇">
      <button class="layer-btn active" data-layer="modern">現代</button>
      <button class="layer-btn" data-layer="britishEmpire">大英帝國</button>
      <button class="layer-btn" data-layer="romanEmpire">羅馬帝國</button>
      <button class="layer-btn" data-layer="prussia">普魯士</button>
      <button class="layer-btn" data-layer="japaneseEmpire">大日本帝國</button>
    </div>
  </div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>請選擇一個國家</h2>
      <button id="clearBtn" class="btn-close">清除</button>
    </div>
    <div id="countryInfo" class="country-panel">
      <p class="no-art">點選地圖上的國家以查看對應畫作。</p>
    </div>
  </aside>
</div>

<div class="zoom-controls" aria-hidden="false">
  <button id="zoomIn" class="zoom-btn" aria-label="放大">+</button>
  <button id="zoomOut" class="zoom-btn" aria-label="縮小">−</button>
  <button id="zoomReset" class="zoom-btn" aria-label="重置">◯</button>
</div>

<div id="modal" aria-hidden="true">
  <div class="modal-inner">
    <button id="closeModal" class="btn-close" style="float:right">關閉</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const geojsonUrl = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';

const numericCountryToIso2 = {
  '156': 'CN',
  '392': 'JP',
  '250': 'FR',
  '840': 'US',
  '124': 'CA',
  '276': 'DE',
  '826': 'GB',
  '380': 'IT',
  '643': 'RU',
  '356': 'IN',
  '710': 'ZA',
  '76': 'BR',
  '484': 'MX',
  '032': 'AR',
  '036': 'AU',
  '554': 'NZ',
  '704': 'VN',
  '764': 'TH',
  '702': 'SG',
  '360': 'ID',
  '458': 'MY',
  '608': 'PH',
  '410': 'KR',
  '804': 'UA',
  '398': 'KZ',
  '050': 'BD',
  '344': 'HK',
  '528': 'NL',
  '724': 'ES',
  '752': 'SE',
  '203': 'CZ',
  '756': 'CH'
};

const englishToChinese = {
  'China': '中國',
  'Japan': '日本',
  'United States': '美國',
  'France': '法國',
  'Germany': '德國',
  'United Kingdom': '英國',
  'South Korea': '韓國',
  'Italy': '義大利',
  'Spain': '西班牙',
  'Russia': '俄羅斯',
  'Canada': '加拿大',
  'Australia': '澳大利亞'
};

const artworkData = {
  "CN": [
    { title: "中國的記憶", url: "China.png", year: 2026, desc: "0000" }
  ],
  "DE": [
    { title: "德國的記憶", url: "Germany.png", year: 2026, desc: "0000" }
  ],
  "FR": [
    { title: "法國的記憶", url: "france.png", year: 2026, desc: "0000" }
  ],
  "JP": [
    { title: "日本的記憶", url: "Japan.png", year: 2024, desc: "0000" }
  ],
  "CA": [
    { title: "加拿大的記憶", url: "canda1.png", year: 2026, desc: "0000" }
  ],
  "US": [
    { title: "美國的記憶", url: "american.png", year: 2021, desc: "0000" }
  ]
};

const layerDefinitions = [
  { id: 'modern', label: '現代', visible: true, color: '#dcdcdc' },
  { id: 'britishEmpire', label: '大英帝國', visible: false, color: '#7ec8e3' },
  { id: 'romanEmpire', label: '羅馬帝國', visible: false, color: '#f5b7b1' },
  { id: 'prussia', label: '普魯士', visible: false, color: '#a8d08d' },
  { id: 'japaneseEmpire', label: '大日本帝國', visible: false, color: '#f7c6a6' }
];

const layerStates = Object.fromEntries(layerDefinitions.map(layer => [layer.id, layer]));

function makeMultiPolygon(coordinatesList) {
  return {
    type: 'Feature',
    geometry: {
      type: 'MultiPolygon',
      coordinates: coordinatesList
    },
    properties: {}
  };
}

const historicalLayers = {
  britishEmpire: {
    type: 'FeatureCollection',
    features: [
      makeMultiPolygon([
        [
          [[-10, 50], [-8, 58], [2, 61], [10, 70], [18, 72], [10, 57], [12, 47], [5, 40], [-5, 35], [-10, 50]]
        ],
        [
          [[-75, 60], [-70, 52], [-60, 49], [-50, 43], [-35, 38], [-25, 45], [-15, 50], [-25, 63], [-38, 68], [-52, 70], [-68, 69], [-75, 60]]
        ],
        [
          [[-15, 35], [0, 30], [18, 22], [32, 18], [42, 10], [58, 0], [75, -10], [80, -30], [68, -38], [52, -35], [35, -20], [20, -8], [6, 6], [-5, 18], [-15, 35]]
        ],
        [
          [[-15, -35], [0, -20], [20, -12], [35, -18], [44, -30], [48, -45], [35, -55], [12, -50], [-5, -45], [-15, -35]]
        ],
        [
          [[110, -12], [120, -16], [135, -20], [145, -15], [147, -8], [138, 0], [120, 6], [112, 1], [110, -12]]
        ]
      ])
    ]
  },
  romanEmpire: {
    type: 'FeatureCollection',
    features: [
      makeMultiPolygon([
        [
          [[-12, 44], [0, 39], [12, 42], [20, 48], [32, 46], [36, 40], [32, 30], [26, 22], [20, 16], [12, 18], [8, 12], [0, 12], [-8, 18], [-10, 30], [-12, 44]]
        ],
        [
          [[-5, 12], [12, 8], [28, 0], [38, -8], [36, -20], [24, -28], [12, -30], [0, -26], [-5, -10], [-5, 12]]
        ],
        [
          [[10, 36], [16, 32], [24, 30], [30, 34], [34, 40], [25, 51], [16, 52], [10, 45], [10, 36]]
        ]
      ])
    ]
  },
  prussia: {
    type: 'FeatureCollection',
    features: [
      makeMultiPolygon([
        [
          [[7, 54], [12, 52], [15, 49], [18, 46], [15, 42], [10, 39], [7, 43], [4, 48], [7, 54]]
        ],
        [
          [[10, 52], [16, 54], [20, 58], [18, 64], [12, 66], [8, 60], [10, 52]]
        ]
      ])
    ]
  },
  japaneseEmpire: {
    type: 'FeatureCollection',
    features: [
      makeMultiPolygon([
        [
          [[126, 35], [130, 33], [135, 34], [140, 38], [145, 42], [146, 46], [140, 50], [133, 52], [128, 47], [124, 42], [126, 35]]
        ],
        [
          [[124, 30], [130, 22], [136, 18], [144, 20], [148, 26], [142, 28], [136, 30], [130, 35], [124, 30]]
        ],
        [
          [[120, 45], [122, 42], [126, 44], [128, 48], [126, 52], [120, 50], [120, 45]]
        ]
      ])
    ]
  }
};

const width = Math.max(700, window.innerWidth * 0.6);
const height = Math.max(400, window.innerHeight);
const svg = d3.select("#map").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("preserveAspectRatio", "xMidYMid meet");
const g = svg.append('g').attr('id', 'countries');
const tooltip = d3.select("#tooltip");
const hoverPreviewEl = document.getElementById('hoverPreview');
const projection = d3.geoMercator()
  .scale((width / 2 / Math.PI) * 1.1)
  .translate([width / 2, height / 1.8]);
const path = d3.geoPath().projection(projection);

let zoomBehavior;
const sidebarEl = document.getElementById('sidebar');
const historicalLayerGroup = g.append('g').attr('id', 'historical-layer-group');
const historicalLayerMap = {};

function triggerSidebarBounce() {
  sidebarEl.classList.remove('panel-bounce');
  void sidebarEl.offsetWidth;
  sidebarEl.classList.add('panel-bounce');
}

function showSidebar() {
  sidebarEl.style.display = 'block';
  sidebarEl.classList.add('visible');
  triggerSidebarBounce();
}

function hideSidebar() {
  sidebarEl.classList.remove('visible', 'panel-bounce');
  sidebarEl.style.display = 'none';
}

function getNumericIso2(d) {
  const id = String(d && d.id || '');
  return numericCountryToIso2[id] || null;
}

function getCountryKey(d) {
  const iso2 = getNumericIso2(d);
  if (iso2) return iso2;

  const props = d && d.properties ? d.properties : {};
  const name = props.name || props.NAME || props.ADMIN || '';
  const normalized = name.trim();
  if (normalized) return normalized;
  return null;
}

function getCountryDisplayName(d) {
  const props = d && d.properties ? d.properties : {};
  return props.name || props.NAME || props.ADMIN || getCountryKey(d) || '';
}

function getLocalizedDisplay(d) {
  const en = getCountryDisplayName(d);
  const zh = englishToChinese[en] || englishToChinese[getCountryKey(d)] || null;
  return zh ? `${zh} (${en})` : en;
}

function propNameToEnglish(name) {
  const map = { '中國': 'China', '日本': 'Japan', '美國': 'United States' };
  return map[name] || name;
}

function renderHistoricalLayers() {
  Object.keys(historicalLayers).forEach((layerId) => {
    const fullLayer = historicalLayers[layerId];
    const features = Array.isArray(fullLayer.features) ? fullLayer.features : [fullLayer];
    const group = historicalLayerGroup.append('g')
      .attr('class', `historical-layer historical-${layerId}`)
      .style('opacity', layerStates[layerId].visible ? 0.78 : 0)
      .style('display', layerStates[layerId].visible ? 'block' : 'none');

    const selection = group.selectAll('path')
      .data(features)
      .join('path')
      .attr('d', path)
      .attr('fill', layerStates[layerId].color)
      .attr('fill-opacity', 0.75)
      .attr('stroke', 'rgba(255,255,255,0.9)')
      .attr('stroke-width', 0.9);

    historicalLayerMap[layerId] = selection;
  });
}

function syncHistoricalLayerVisibility() {
  Object.keys(layerStates).forEach((layerId) => {
    const group = historicalLayerGroup.select(`.historical-${layerId}`);
    if (!group.empty()) {
      const shouldShow = !!layerStates[layerId].visible && layerId !== 'modern';
      group.style('display', shouldShow ? 'block' : 'none')
        .style('opacity', shouldShow ? 0.78 : 0);
    }
  });
}

function attachLayerControls() {
  document.querySelectorAll('.layer-btn').forEach((button) => {
    button.addEventListener('click', () => {
      const layerId = button.dataset.layer;
      if (!layerId || !layerStates[layerId]) return;

      if (layerId === 'modern') {
        layerStates[layerId].visible = true;
      } else {
        layerStates[layerId].visible = !layerStates[layerId].visible;
      }

      document.querySelectorAll('.layer-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.layer === layerId && (layerId === 'modern' || layerStates[layerId].visible));
      });

      if (layerId !== 'modern') {
        const activeButtons = Object.values(layerStates).filter((layer) => layer.id !== 'modern' && layer.visible).length;
        const modernBtn = document.querySelector('.layer-btn[data-layer="modern"]');
        if (activeButtons === 0) {
          layerStates.modern.visible = true;
          modernBtn.classList.add('active');
        } else if (layerStates.modern.visible && activeButtons > 0) {
          layerStates.modern.visible = false;
          modernBtn.classList.remove('active');
        }
      }

      syncHistoricalLayerVisibility();
    });
  });
}

function renderMap() {
  d3.json(geojsonUrl).then(world => {
    const countries = topojson.feature(world, world.objects.countries);

    g.selectAll("path")
      .data(countries.features)
      .join("path")
        .attr("class", "country")
        .attr("d", path)
        .on("mouseover", (event, d) => {
          d3.select(event.currentTarget).raise();
          tooltip.style("display", "block").text(getLocalizedDisplay(d));
          showHoverPreview(d, event);
        })
        .on("mousemove", (event, d) => {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY + 12) + "px");
          updateHoverPreviewPosition(event);
        })
        .on("mouseout", () => {
          tooltip.style("display", "none");
          hideHoverPreview();
        })
        .on("click", (event, d) => {
          g.selectAll(".country").classed("selected", false);
          d3.select(event.currentTarget).classed("selected", true);
          showArtworksForCountry(d);
        });

    zoomBehavior = d3.zoom()
      .scaleExtent([1, 8])
      .on('zoom', (event) => {
        g.attr('transform', event.transform);
        g.selectAll('.country').style('stroke-width', (0.5 / event.transform.k));
      });

    svg.call(zoomBehavior);
    renderHistoricalLayers();
    attachZoomControls();
    attachLayerControls();

  }).catch(err => {
    document.getElementById('countryInfo').innerHTML = '<p class="no-art">地圖載入失敗，請檢查網路或 TopoJSON 連線。</p>';
    console.error(err);
  });
}

function attachZoomControls() {
  const zoomIn = document.getElementById('zoomIn');
  const zoomOut = document.getElementById('zoomOut');
  const zoomReset = document.getElementById('zoomReset');

  zoomIn.addEventListener('click', () => {
    svg.transition().duration(250).call(zoomBehavior.scaleBy, 1.4);
  });
  zoomOut.addEventListener('click', () => {
    svg.transition().duration(250).call(zoomBehavior.scaleBy, 1 / 1.4);
  });
  zoomReset.addEventListener('click', () => {
    svg.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity);
  });
}

function findArtForFeature(d) {
  const englishName = getCountryDisplayName(d);
  const key = getCountryKey(d);
  const possibleKeys = [key, (key || '').toUpperCase(), (key || '').toLowerCase(), englishName, propNameToEnglish(englishName)];
  for (const k of possibleKeys) {
    if (!k) continue;
    if (artworkData[k]) return artworkData[k];
  }
  if (artworkData[englishName]) return artworkData[englishName];
  return null;
}

function getPreviewArt(d) {
  const arts = findArtForFeature(d);
  if (!arts || arts.length === 0) return null;
  return arts[0];
}

function showHoverPreview(d, event) {
  try {
    if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;

    const art = getPreviewArt(d);
    if (!art) return;

    hoverPreviewEl.innerHTML = '';
    const img = document.createElement('img');
    img.src = art.url;
    img.alt = art.title || '';

    const meta = document.createElement('div');
    meta.className = 'hp-meta';
    const title = document.createElement('div');
    title.className = 'hp-title';
    title.textContent = art.title || '';
    const year = document.createElement('div');
    year.className = 'hp-year';
    year.textContent = art.year ? String(art.year) : '';
    meta.appendChild(title);
    meta.appendChild(year);

    hoverPreviewEl.appendChild(img);
    hoverPreviewEl.appendChild(meta);

    updateHoverPreviewPosition(event);
    hoverPreviewEl.classList.add('visible');
    hoverPreviewEl.setAttribute('aria-hidden', 'false');
  } catch (e) {
    console.error('hover preview error', e);
  }
}

function updateHoverPreviewPosition(event) {
  if (!hoverPreviewEl) return;
  const padding = 12;
  const boxW = hoverPreviewEl.offsetWidth || 260;
  const boxH = hoverPreviewEl.offsetHeight || 100;
  let x = (event.pageX || event.clientX + window.scrollX) + 18;
  let y = (event.pageY || event.clientY + window.scrollY) + 18;

  const winW = window.innerWidth;
  const winH = window.innerHeight;

  if (x + boxW + padding > winW) {
    x = (event.pageX || event.clientX + window.scrollX) - boxW - 18;
  }
  if (y + boxH + padding > (window.scrollY + winH)) {
    y = (event.pageY || event.clientY + window.scrollY) - boxH - 18;
  }

  hoverPreviewEl.style.left = x + 'px';
  hoverPreviewEl.style.top = y + 'px';
}

function hideHoverPreview() {
  if (!hoverPreviewEl) return;
  hoverPreviewEl.classList.remove('visible');
  hoverPreviewEl.setAttribute('aria-hidden', 'true');
}

function showArtworksForCountry(d) {
  showSidebar();

  const englishName = getCountryDisplayName(d);
  const localized = getLocalizedDisplay(d);
  const key = getCountryKey(d);
  const possibleKeys = [key, (key || '').toUpperCase(), (key || '').toLowerCase(), englishName, propNameToEnglish(englishName)];
  let arts = null;

  for (const k of possibleKeys) {
    if (!k) continue;
    if (artworkData[k]) {
      arts = artworkData[k];
      break;
    }
  }

  if (!arts && artworkData[englishName]) arts = artworkData[englishName];

  const container = document.getElementById('countryInfo');
  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'detail-header';

  const title = document.createElement('h3');
  title.className = 'country-title';
  title.textContent = localized;

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-close';
  backBtn.textContent = '回到地圖';
  backBtn.onclick = () => clearSelection();

  header.appendChild(title);
  header.appendChild(backBtn);
  container.appendChild(header);

  if (!arts || arts.length === 0) {
    const p = document.createElement('p');
    p.className = 'no-art';
    p.textContent = '該國家暫無畫作，您可以在 artworkData 中加入對應作品。';
    container.appendChild(p);
    return;
  }

  const list = document.createElement('div');
  list.className = 'art-list';

  arts.forEach((art, idx) => {
    const item = document.createElement('div');
    item.className = 'art-item';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = art.url;
    img.alt = art.title || '';
    img.onclick = () => openModal(art);

    const meta = document.createElement('div');
    meta.className = 'art-meta';

    const titleLink = document.createElement('span');
    titleLink.className = 'wiki-link';
    titleLink.textContent = art.title || 'Untitled';
    titleLink.onclick = () => showSubpage(englishName, idx, arts);

    const year = document.createElement('div');
    year.className = 'art-year';
    year.textContent = art.year ? String(art.year) : '';

    const desc = document.createElement('div');
    desc.className = 'art-desc';
    desc.textContent = art.desc || '';

    meta.appendChild(titleLink);
    meta.appendChild(year);
    meta.appendChild(desc);
    item.appendChild(img);
    item.appendChild(meta);
    list.appendChild(item);
  });

  container.appendChild(list);
}

function showSubpage(countryEnglishName, artIndex, arts) {
  showSidebar();

  const container = document.getElementById('countryInfo');
  const art = arts[artIndex];
  if (!art) return;

  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'detail-header';

  const title = document.createElement('h3');
  title.className = 'country-title';
  title.textContent = art.title || countryEnglishName;

  const back = document.createElement('button');
  back.className = 'mini-link';
  back.textContent = '← 返回列表';
  back.onclick = () => {
    const features = svg.selectAll('path').data();
    const feature = features.find(f => getCountryDisplayName(f) === countryEnglishName);
    if (feature) showArtworksForCountry(feature);
    else {
      document.getElementById('countryInfo').innerHTML = '<p class="no-art">無法找到該國家的地圖資料。</p>';
    }
    history.pushState(null, '', '#');
  };

  header.appendChild(title);
  header.appendChild(back);
  container.appendChild(header);

  const detail = document.createElement('div');
  detail.className = 'detail-container';

  const img = document.createElement('img');
  img.className = 'detail-image';
  img.src = art.url;
  img.alt = art.title || '';
  img.onclick = () => openModal(art);

  const desc = document.createElement('p');
  desc.className = 'detail-text';
  desc.textContent = art.desc || '';

  if (art.year) {
    const year = document.createElement('p');
    year.className = 'detail-text';
    year.textContent = '年份：' + art.year;
    detail.appendChild(year);
  }

  detail.appendChild(img);
  detail.appendChild(desc);
  container.appendChild(detail);

  history.pushState(null, '', `#art/${encodeURIComponent(countryEnglishName)}/${artIndex}`);
}

function openModal(art) {
  const modalContent = document.getElementById('modalContent');
  modalContent.innerHTML = '';

  const h = document.createElement('h3');
  h.textContent = art.title || '';

  const img = document.createElement('img');
  img.src = art.url;
  img.alt = art.title || '';

  const p = document.createElement('p');
  p.textContent = art.desc || '';

  modalContent.appendChild(h);
  modalContent.appendChild(img);
  modalContent.appendChild(p);
  document.getElementById('modal').style.display = 'flex';
}

let modalTouchStartY = null;
document.getElementById('modal').addEventListener('touchstart', (e) => {
  if (e.touches && e.touches[0]) modalTouchStartY = e.touches[0].clientY;
});
document.getElementById('modal').addEventListener('touchmove', (e) => {
  if (!modalTouchStartY) return;
  const y = e.touches[0].clientY;
  const diff = y - modalTouchStartY;
  if (diff > 120) {
    closeModal();
    modalTouchStartY = null;
  }
});

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function clearSelection() {
  g.selectAll('.country').classed('selected', false);
  document.getElementById('countryInfo').innerHTML = '<p class="no-art">點選地圖上的國家以查看對應畫作。</p>';
  hideSidebar();
  history.pushState(null, '', '#');
}

function handleHashOnLoad() {
  const hash = location.hash || '';
  if (!hash) return;
  const match = hash.match(/^#art\/(.+)\/(\d+)$/);
  if (!match) return;

  const countryName = decodeURIComponent(match[1]);
  const artIndex = Number(match[2]);

  const tryShow = () => {
    const features = svg.selectAll('path').data();
    if (!features || features.length === 0) {
      setTimeout(tryShow, 200);
      return;
    }

    const feature = features.find(f => {
      const name = getCountryDisplayName(f);
      const key = getCountryKey(f);
      return name === countryName || key === countryName || (f.properties && (f.properties.name === countryName || f.properties.ADMIN === countryName));
    });

    if (feature) {
      g.selectAll('.country').classed('selected', false);
      svg.selectAll('path')
        .filter(d => getCountryDisplayName(d) === countryName || getCountryKey(d) === countryName)
        .classed('selected', true);

      showSidebar();

      const arts = artworkData[getCountryKey(feature)] || artworkData[getCountryDisplayName(feature)] || artworkData[feature.properties?.name];
      if (arts && arts[artIndex]) {
        showSubpage(getCountryDisplayName(feature), artIndex, arts);
      } else {
        showArtworksForCountry(feature);
      }
    }
  };

  tryShow();
}

document.getElementById('clearBtn').addEventListener('click', clearSelection);
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

hideSidebar();
renderMap();
handleHashOnLoad();
</script>
</body>
